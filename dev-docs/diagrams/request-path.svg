<svg font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" color="#000000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-label="Every API route runs the same chain: session check, body validation, then the handler. Each failure leaves as one error shape."><defs><marker id="request-path-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"></path></marker><marker id="request-path-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb4903"></path></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g><rect x="20" y="60" width="130" height="56" rx="10" fill="#dceeff" stroke="currentColor" stroke-width="1.5"></rect><text x="85" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">API request</text><text x="85" y="101" text-anchor="middle" font-size="11.5" fill="currentColor">cookie attached</text></g><g><rect x="190" y="60" width="150" height="56" rx="10" fill="#e9ccff" stroke="currentColor" stroke-width="1.5"></rect><text x="265" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">withUser()</text><text x="265" y="101" text-anchor="middle" font-size="11.5" fill="currentColor">lib/http.ts</text></g><g><rect x="380" y="60" width="150" height="56" rx="10" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></rect><text x="455" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">requireUser()</text><text x="455" y="101" text-anchor="middle" font-size="11.5" fill="currentColor">session to user</text></g><g><rect x="570" y="60" width="130" height="56" rx="10" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></rect><text x="635" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">handler</text><text x="635" y="101" text-anchor="middle" font-size="11.5" fill="currentColor">Zod parses the body</text></g><g><rect x="740" y="60" width="100" height="56" rx="10" fill="#55db9c" stroke="currentColor" stroke-width="1.5"></rect><text x="790" y="92.5" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">200 JSON</text></g><path d="M150 88 H188" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#request-path-arrow)"></path><path d="M340 88 H378" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#request-path-arrow)"></path><path d="M530 88 H568" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#request-path-arrow)"></path><path d="M700 88 H738" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#request-path-arrow)"></path><g><rect x="380" y="200" width="150" height="56" rx="10" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></rect><text x="455" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">401</text><text x="455" y="241" text-anchor="middle" font-size="11.5" fill="currentColor">UNAUTHENTICATED</text></g><g><rect x="560" y="200" width="150" height="56" rx="10" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></rect><text x="635" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">400, 409, 429, 503</text><text x="635" y="241" text-anchor="middle" font-size="11.5" fill="currentColor">AppError, its own status</text></g><g><rect x="730" y="200" width="120" height="56" rx="10" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></rect><text x="790" y="225" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">500 INTERNAL</text><text x="790" y="241" text-anchor="middle" font-size="11.5" fill="currentColor">logged, generic text</text></g><path d="M455 116 V198" fill="none" stroke="#fb4903" stroke-width="1.5" marker-end="url(#request-path-hot)"></path><text x="461" y="160" text-anchor="start" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no session</text><path d="M635 116 V198" fill="none" stroke="#fb4903" stroke-width="1.5" marker-end="url(#request-path-hot)"></path><text x="641" y="150" text-anchor="start" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">AppError</text><path d="M690 116 L775 198" fill="none" stroke="#fb4903" stroke-width="1.5" marker-end="url(#request-path-hot)"></path><text x="742" y="150" text-anchor="start" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">unexpected</text><text x="615" y="286" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Every error body is { error: { code, message, issues? } }</text></svg>
