<svg font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" color="#000000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" role="img" aria-label="The browser only talks to the Next.js app. Every request passes the same session check, and only the server reaches Google, Postgres and OpenAI."><defs><marker id="system-architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"></path></marker><marker id="system-architecture-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb4903"></path></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="210" y="40" width="410" height="370" rx="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="6 5"></rect><text x="226" y="62" text-anchor="start" font-size="11.5" font-weight="700" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Vercel: one Next.js app</text><text x="604" y="62" text-anchor="end" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">secrets stay on this side</text><g><rect x="20" y="180" width="150" height="80" rx="10" fill="#dceeff" stroke="currentColor" stroke-width="1.5"></rect><text x="95" y="217" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Browser</text><text x="95" y="233" text-anchor="middle" font-size="11.5" fill="currentColor">React, TanStack Query</text></g><g><rect x="230" y="80" width="180" height="54" rx="10" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></rect><text x="320" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Pages</text><text x="320" y="120" text-anchor="middle" font-size="11.5" fill="currentColor">server components</text></g><g><rect x="420" y="80" width="180" height="54" rx="10" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></rect><text x="510" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">API routes</text><text x="510" y="120" text-anchor="middle" font-size="11.5" fill="currentColor">/api/me, /api/fact</text></g><g><rect x="230" y="162" width="370" height="54" rx="10" fill="#e9ccff" stroke="currentColor" stroke-width="1.5"></rect><text x="415" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">withUser + requireUser()</text><text x="415" y="202" text-anchor="middle" font-size="11.5" fill="currentColor">session cookie to user, or 401 and redirect</text></g><g><rect x="230" y="244" width="180" height="54" rx="10" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></rect><text x="320" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">lib/facts.ts</text><text x="320" y="284" text-anchor="middle" font-size="11.5" fill="currentColor">cache, lease, cap</text></g><g><rect x="420" y="244" width="180" height="54" rx="10" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></rect><text x="510" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">lib/auth.ts</text><text x="510" y="284" text-anchor="middle" font-size="11.5" fill="currentColor">Better Auth</text></g><g><rect x="230" y="326" width="180" height="54" rx="10" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></rect><text x="320" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">lib/openai.ts</text><text x="320" y="366" text-anchor="middle" font-size="11.5" fill="currentColor">8 s timeout, no retries</text></g><g><rect x="420" y="326" width="180" height="54" rx="10" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></rect><text x="510" y="350" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">lib/db.ts</text><text x="510" y="366" text-anchor="middle" font-size="11.5" fill="currentColor">Prisma on a pg pool</text></g><g><rect x="670" y="48" width="170" height="60" rx="10" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></rect><text x="755" y="75" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Google OAuth</text><text x="755" y="91" text-anchor="middle" font-size="11.5" fill="currentColor">consent, profile</text></g><g><rect x="670" y="200" width="170" height="80" rx="10" fill="#55db9c" stroke="currentColor" stroke-width="1.5"></rect><text x="755" y="237" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Supabase Postgres</text><text x="755" y="253" text-anchor="middle" font-size="11.5" fill="currentColor">RLS on every table</text></g><g><rect x="670" y="340" width="170" height="60" rx="10" fill="#ffd731" stroke="currentColor" stroke-width="1.5"></rect><text x="755" y="367" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">OpenAI</text><text x="755" y="383" text-anchor="middle" font-size="11.5" fill="currentColor">Responses API</text></g><path d="M170 206 H190 V107 H208" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#system-architecture-arrow)"></path><text x="186" y="150" text-anchor="end" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">HTTPS +</text><text x="186" y="164" text-anchor="end" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">cookie</text><path d="M95 180 V14 H755 V46" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#system-architecture-arrow)"></path><text x="432" y="30" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">browser redirect for Google consent</text><path d="M320 134 V160" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#system-architecture-arrow)"></path><path d="M510 134 V160" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#system-architecture-arrow)"></path><path d="M320 216 V242" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#system-architecture-arrow)"></path><path d="M510 216 V242" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#system-architecture-arrow)"></path><path d="M320 298 V324" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#system-architecture-arrow)"></path><path d="M380 298 L455 324" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#system-architecture-arrow)"></path><path d="M510 298 V324" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#system-architecture-arrow)"></path><path d="M600 271 H625 V78 H668" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#system-architecture-arrow)"></path><text x="621" y="152" text-anchor="end" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">code for profile</text><path d="M600 353 H645 V240 H668" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#system-architecture-arrow)"></path><text x="650" y="312" text-anchor="start" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">pooled SQL</text><path d="M320 380 V424 H755 V402" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#system-architecture-arrow)"></path><text x="540" y="442" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">prompt with the title as quoted data</text></svg>
