<svg font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" color="#000000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 600" role="img" aria-label="A request either serves a fresh fact, wins the lease and generates, or waits for the holder. Every failure path ends in the last saved fact or a clear error."><defs><marker id="fact-flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"></path></marker><marker id="fact-flow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb4903"></path></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g><rect x="175" y="16" width="150" height="44" rx="10" fill="#dceeff" stroke="currentColor" stroke-width="1.5"></rect><text x="250" y="42.5" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">GET /api/fact</text></g><g><polygon points="250,78 355,110 250,142 145,110" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></polygon><text x="250" y="114.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">fact under 60 s old?</text></g><g><rect x="400" y="88" width="140" height="44" rx="10" fill="#55db9c" stroke="currentColor" stroke-width="1.5"></rect><text x="470" y="114.5" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">return cache</text></g><g><rect x="165" y="175" width="170" height="52" rx="10" fill="#e9ccff" stroke="currentColor" stroke-width="1.5"></rect><text x="250" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">claim lease</text><text x="250" y="214" text-anchor="middle" font-size="11.5" fill="currentColor">one conditional UPDATE</text></g><g><polygon points="250,248 335,278 250,308 165,278" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></polygon><text x="250" y="282.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">won the lease?</text></g><g><polygon points="250,330 345,360 250,390 155,360" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></polygon><text x="250" y="364.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">20 facts in 10 min?</text></g><g><rect x="10" y="338" width="120" height="44" rx="10" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></rect><text x="70" y="364.5" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">last fact, or 429</text></g><g><rect x="165" y="420" width="170" height="52" rx="10" fill="#ffd731" stroke="currentColor" stroke-width="1.5"></rect><text x="250" y="443" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">call OpenAI</text><text x="250" y="459" text-anchor="middle" font-size="11.5" fill="currentColor">8 s timeout, no retries</text></g><g><rect x="10" y="424" width="120" height="44" rx="10" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></rect><text x="70" y="450.5" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">last fact, or 503</text></g><g><rect x="150" y="520" width="200" height="44" rx="10" fill="#55db9c" stroke="currentColor" stroke-width="1.5"></rect><text x="250" y="546.5" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">store, return generated</text></g><text x="250" y="590" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">the holder releases the lease in finally</text><path d="M250 60 V76" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#fact-flow-arrow)"></path><path d="M355 110 H398" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#fact-flow-arrow)"></path><text x="376" y="102" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><path d="M250 142 V173" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#fact-flow-arrow)"></path><text x="256" y="162" text-anchor="start" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><path d="M250 227 V246" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#fact-flow-arrow)"></path><path d="M250 308 V328" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#fact-flow-arrow)"></path><text x="256" y="322" text-anchor="start" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><path d="M155 360 H132" fill="none" stroke="#fb4903" stroke-width="1.5" marker-end="url(#fact-flow-hot)"></path><text x="143" y="352" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><path d="M250 390 V418" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#fact-flow-arrow)"></path><text x="256" y="408" text-anchor="start" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><path d="M165 446 H132" fill="none" stroke="#fb4903" stroke-width="1.5" marker-end="url(#fact-flow-hot)"></path><text x="148" y="438" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">fails</text><path d="M250 472 V518" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#fact-flow-arrow)"></path><text x="256" y="500" text-anchor="start" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">ok</text><path d="M335 278 H568" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#fact-flow-arrow)"></path><text x="452" y="270" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no: someone else is generating</text><g><rect x="570" y="252" width="150" height="52" rx="10" fill="#e9ccff" stroke="currentColor" stroke-width="1.5"></rect><text x="645" y="275" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">wait 500 ms</text><text x="645" y="291" text-anchor="middle" font-size="11.5" fill="currentColor">no connection held</text></g><g><polygon points="645,340 730,370 645,400 560,370" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></polygon><text x="645" y="374.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">fact appeared?</text></g><g><rect x="760" y="348" width="110" height="44" rx="10" fill="#55db9c" stroke="currentColor" stroke-width="1.5"></rect><text x="815" y="374.5" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">return shared</text></g><g><polygon points="645,432 720,460 645,488 570,460" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></polygon><text x="645" y="464.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">lease free?</text></g><g><polygon points="645,519 715,545 645,571 575,545" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></polygon><text x="645" y="549.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="currentColor">9 s passed?</text></g><g><rect x="420" y="523" width="120" height="44" rx="10" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></rect><text x="480" y="549.5" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">last fact, or 503</text></g><path d="M645 304 V338" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#fact-flow-arrow)"></path><path d="M730 370 H758" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#fact-flow-arrow)"></path><text x="744" y="362" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><path d="M645 400 V430" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#fact-flow-arrow)"></path><text x="651" y="420" text-anchor="start" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><path d="M570 460 H420 V360 H347" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#fact-flow-arrow)"></path><text x="495" y="452" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes: take over</text><path d="M645 488 V517" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#fact-flow-arrow)"></path><text x="651" y="507" text-anchor="start" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><path d="M575 545 H542" fill="none" stroke="#fb4903" stroke-width="1.5" marker-end="url(#fact-flow-hot)"></path><text x="558" y="537" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><path d="M715 545 H880 V278 H722" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fact-flow-arrow)"></path><text x="872" y="430" text-anchor="end" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no: poll again</text></svg>
