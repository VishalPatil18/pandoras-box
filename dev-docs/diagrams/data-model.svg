<svg font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" color="#000000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" role="img" aria-label="Better Auth owns user, session and account. The app adds three columns to user (shaded) and its own fact table, which keeps every fact as history."><defs><marker id="data-model-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"></path></marker><marker id="data-model-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb4903"></path></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g><rect x="30" y="110" width="250" height="20" fill="#e9ccff"></rect><rect x="30" y="130" width="250" height="20" fill="#e9ccff"></rect><rect x="30" y="150" width="250" height="20" fill="#e9ccff"></rect><rect x="30" y="20" width="250" height="156" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"></rect><line x1="30" y1="50" x2="280" y2="50" stroke="currentColor" stroke-width="1.2"></line><text x="42" y="40" font-size="13" font-weight="700" fill="currentColor">user</text><g><text x="42" y="64" font-size="12" fill="currentColor">id</text><text x="268" y="64" text-anchor="end" font-size="11.5" fill="currentColor">PK</text></g><g><text x="42" y="84" font-size="12" fill="currentColor">name, email, image</text><text x="268" y="84" text-anchor="end" font-size="11.5" fill="currentColor">from Google</text></g><g><text x="42" y="104" font-size="12" fill="currentColor">createdAt, updatedAt</text><text x="268" y="104" text-anchor="end" font-size="11.5" fill="currentColor">timestamps</text></g><g><text x="42" y="124" font-size="12" fill="currentColor">favoriteMovie</text><text x="268" y="124" text-anchor="end" font-size="11.5" fill="currentColor">varchar(100), null</text></g><g><text x="42" y="144" font-size="12" fill="currentColor">factLeaseUntil</text><text x="268" y="144" text-anchor="end" font-size="11.5" fill="currentColor">timestamptz, null</text></g><g><text x="42" y="164" font-size="12" fill="currentColor">factLeaseToken</text><text x="268" y="164" text-anchor="end" font-size="11.5" fill="currentColor">text, null</text></g></g><g><rect x="580" y="20" width="250" height="156" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"></rect><line x1="580" y1="50" x2="830" y2="50" stroke="currentColor" stroke-width="1.2"></line><text x="592" y="40" font-size="13" font-weight="700" fill="currentColor">fact</text><g><text x="592" y="64" font-size="12" fill="currentColor">id</text><text x="818" y="64" text-anchor="end" font-size="11.5" fill="currentColor">PK</text></g><g><text x="592" y="84" font-size="12" fill="currentColor">userId</text><text x="818" y="84" text-anchor="end" font-size="11.5" fill="currentColor">FK to user</text></g><g><text x="592" y="104" font-size="12" fill="currentColor">movieTitle</text><text x="818" y="104" text-anchor="end" font-size="11.5" fill="currentColor">as typed</text></g><g><text x="592" y="124" font-size="12" fill="currentColor">movieKey</text><text x="818" y="124" text-anchor="end" font-size="11.5" fill="currentColor">lowercased</text></g><g><text x="592" y="144" font-size="12" fill="currentColor">text</text><text x="818" y="144" text-anchor="end" font-size="11.5" fill="currentColor">the trivia</text></g><g><text x="592" y="164" font-size="12" fill="currentColor">createdAt</text><text x="818" y="164" text-anchor="end" font-size="11.5" fill="currentColor">set by now()</text></g></g><text x="705" y="196" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">index (userId, movieKey, createdAt DESC)</text><g><rect x="30" y="240" width="250" height="96" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"></rect><line x1="30" y1="270" x2="280" y2="270" stroke="currentColor" stroke-width="1.2"></line><text x="42" y="260" font-size="13" font-weight="700" fill="currentColor">session</text><g><text x="42" y="284" font-size="12" fill="currentColor">token</text><text x="268" y="284" text-anchor="end" font-size="11.5" fill="currentColor">unique</text></g><g><text x="42" y="304" font-size="12" fill="currentColor">userId</text><text x="268" y="304" text-anchor="end" font-size="11.5" fill="currentColor">FK to user</text></g><g><text x="42" y="324" font-size="12" fill="currentColor">expiresAt</text><text x="268" y="324" text-anchor="end" font-size="11.5" fill="currentColor">timestamp</text></g></g><g><rect x="330" y="240" width="220" height="96" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"></rect><line x1="330" y1="270" x2="550" y2="270" stroke="currentColor" stroke-width="1.2"></line><text x="342" y="260" font-size="13" font-weight="700" fill="currentColor">account</text><g><text x="342" y="284" font-size="12" fill="currentColor">userId</text><text x="538" y="284" text-anchor="end" font-size="11.5" fill="currentColor">FK to user</text></g><g><text x="342" y="304" font-size="12" fill="currentColor">providerId</text><text x="538" y="304" text-anchor="end" font-size="11.5" fill="currentColor">google</text></g><g><text x="342" y="324" font-size="12" fill="currentColor">tokens</text><text x="538" y="324" text-anchor="end" font-size="11.5" fill="currentColor">from Google</text></g></g><path d="M280 60 H578" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#data-model-arrow)"></path><text x="429" y="52" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">one user, many facts (cascade delete)</text><path d="M155 176 V238" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#data-model-arrow)"></path><text x="161" y="212" text-anchor="start"