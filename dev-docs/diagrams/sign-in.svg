ert user, insert session</text><g><rect x="560" y="190" width="130" height="56" rx="10" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></rect><text x="625" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">/onboarding</text><text x="625" y="231" text-anchor="middle" font-size="11.5" fill="currentColor">pick a movie</text></g><g><rect x="710" y="190" width="120" height="56" rx="10" fill="#dceeff" stroke="currentColor" stroke-width="1.5"></rect><text x="770" y="222.5" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">/dashboard</text></g><path d="M770 108 V188" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#sign-in-arrow)"></path><text x="776" y="150" text-anchor="start" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">yes</text><path d="M740 96 L640 188" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#sign-in-arrow)"></path><text x="672" y="140" text-anchor="end" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">no</text><path d="M690 218 H708" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#sign-in-arrow)"></path><text x="700" y="270" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">PUT /api/me/movie, then dashboard</text></svg>
