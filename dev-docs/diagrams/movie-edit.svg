<svg font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" color="#000000" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 262" role="img" aria-label="Saving shows the new title at once and pauses the fact query. Success loads the new movie&#x27;s fact; failure restores the old title and explains why."><defs><marker id="movie-edit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"></path></marker><marker id="movie-edit-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#fb4903"></path></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g><rect x="20" y="100" width="120" height="50" rx="10" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></rect><text x="80" y="129.5" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Viewing</text></g><g><rect x="220" y="100" width="120" height="50" rx="10" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></rect><text x="280" y="129.5" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Editing</text></g><g><rect x="420" y="100" width="140" height="50" rx="10" fill="#e9ccff" stroke="currentColor" stroke-width="1.5"></rect><text x="490" y="122" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Saving</text><text x="490" y="138" text-anchor="middle" font-size="11.5" fill="currentColor">new title shown</text></g><g><rect x="660" y="34" width="180" height="50" rx="10" fill="#55db9c" stroke="currentColor" stroke-width="1.5"></rect><text x="750" y="56" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Saved</text><text x="750" y="72" text-anchor="middle" font-size="11.5" fill="currentColor">new movie&#x27;s fact loads</text></g><g><rect x="660" y="166" width="180" height="50" rx="10" fill="#ffffff" stroke="currentColor" stroke-width="1.5"></rect><text x="750" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="currentColor">Rolled back</text><text x="750" y="204" text-anchor="middle" font-size="11.5" fill="currentColor">old title, toast says why</text></g><path d="M140 118 H218" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#movie-edit-arrow)"></path><text x="179" y="110" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Edit</text><path d="M260 150 C260 196 90 196 90 152" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#movie-edit-arrow)"></path><text x="175" y="210" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Cancel or Escape</text><path d="M250 100 C250 62 310 62 310 98" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#movie-edit-arrow)"></path><text x="280" y="58" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">invalid: inline error</text><path d="M340 125 H418" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#movie-edit-arrow)"></path><text x="379" y="117" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">Save</text><text x="490" y="172" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">fact query paused</text><path d="M560 112 L658 64" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#movie-edit-arrow)"></path><text x="604" y="78" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">200</text><path d="M560 138 L658 186" fill="none" stroke="#fb4903" stroke-width="1.5" marker-end="url(#movie-edit-hot)"></path><text x="604" y="180" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">error</text><path d="M750 34 V14 H60 V98" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#movie-edit-arrow)"></path><path d="M750 216 V244 H60 V152" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#movie-edit-arrow)"></path><text x="400" y="240" text-anchor="middle" font-size="11.5" font-weight="500" fill="currentColor" stroke="#ffffff" stroke-width="4" stroke-linejoin="round" paint-order="stroke">back to Viewing</text></svg>
